<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeamHub 球隊雲端整合管理平台</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .hero-section {
      text-align: center;
      padding: 3rem 1rem 2rem;
    }
    .hero-title {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--primary-navy);
      margin-bottom: 0.8rem;
    }
    .hero-subtitle {
      font-size: 1.15rem;
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto 2rem;
    }
    .auth-card {
      max-width: 440px;
      margin: 0 auto;
    }
    .tab-header {
      display: flex;
      border-bottom: 2px solid var(--border-color);
      margin-bottom: 1.5rem;
    }
    .tab-btn {
      flex: 1;
      padding: 0.75rem;
      background: none;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
    }
    .tab-btn.active {
      color: var(--primary-navy);
      border-bottom: 3px solid var(--accent-green);
      margin-bottom: -2px;
    }
    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.25rem;
      margin-top: 3rem;
    }
    .feature-item {
      background: #ffffff;
      padding: 1.25rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }
    .feature-icon {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>

  <!-- 頂部導覽列 -->
  <header class="navbar">
    <a href="/" class="brand-container">
      <span>🏐 TeamHub</span>
      <span class="brand-badge">Cloud</span>
    </a>
    <div>
      <span style="font-size: 0.85rem; color: #94a3b8;">雲端服務應用導論專案</span>
    </div>
  </header>

  <main class="container">
    <div class="hero-section">
      <h1 class="hero-title">球隊雲端整合管理平台</h1>
      <p class="hero-subtitle">
        告別散亂的 LINE 記事本與 Excel 試算表，一站式搞定球衣訂購、練習請假、出席統計與比賽報名！
      </p>
    </div>

    <!-- 登入 / 註冊 卡片容器 -->
    <div class="card auth-card">
      <div class="tab-header">
        <button id="tab-login" class="tab-btn active" onclick="switchTab('login')">隊員登入</button>
        <button id="tab-register" class="tab-btn" onclick="switchTab('register')">新隊員註冊</button>
      </div>

      <!-- 登入表單 -->
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">電子信箱 (Email)</label>
          <input type="email" id="login-email" class="form-control" placeholder="user@teamhub.edu" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">密碼</label>
          <input type="password" id="login-password" class="form-control" placeholder="請輸入密碼" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
          登入 TeamHub
        </button>
      </form>

      <!-- 註冊表單 -->
      <form id="register-form" style="display: none;">
        <div class="form-group">
          <label class="form-label" for="reg-name">姓名</label>
          <input type="text" id="reg-name" class="form-control" placeholder="請輸入真實姓名" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-email">電子信箱 (Email)</label>
          <input type="email" id="reg-email" class="form-control" placeholder="user@teamhub.edu" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-password">設定密碼</label>
          <input type="password" id="reg-password" class="form-control" placeholder="至少 6 碼英數字" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-role">隊伍身分</label>
          <select id="reg-role" class="form-control">
            <option value="member">一般隊員</option>
            <option value="manager">球經 (需後台審核)</option>
            <option value="captain">隊長 (需後台審核)</option>
          </select>
        </div>
        <button type="submit" class="btn btn-navy" style="width: 100%; margin-top: 0.5rem;">
          建立新帳號
        </button>
      </form>
    </div>

    <!-- 系統四大模組預覽卡片 -->
    <div class="features-grid">
      <div class="feature-item">
        <div class="feature-icon">👕</div>
        <h3>球衣線上訂購</h3>
        <p style="font-size: 0.9rem; color: var(--text-muted); margin-top: 0.4rem;">
          尺寸、背號自選，系統即時對帳，一鍵匯出廠商名單。
        </p>
      </div>
      <div class="feature-item">
        <div class="feature-icon">📅</div>
        <h3>練習出缺席點名</h3>
        <p style="font-size: 0.9rem; color: var(--text-muted); margin-top: 0.4rem;">
          線上請假不漏單，系統自動結算出勤率，出席紀錄一目了然。
        </p>
      </div>
      <div class="feature-item">
        <div class="feature-icon">🏆</div>
        <h3>比賽一鍵報名</h3>
        <p style="font-size: 0.9rem; color: var(--text-muted); margin-top: 0.4rem;">
          個人檔案重複套用，告別每次重複填表，即時匯出報名表。
        </p>
      </div>
      <div class="feature-item">
        <div class="feature-icon">🏐</div>
        <h3>排球戰術陣型</h3>
        <p style="font-size: 0.9rem; color: var(--text-muted); margin-top: 0.4rem;">
          直覺化排球場俯視圖，六人輪轉站位輕鬆調整與保存。
        </p>
      </div>
    </div>
  </main>

  <script>
    function switchTab(tab) {
      const loginTab = document.getElementById('tab-login');
      const registerTab = document.getElementById('tab-register');
      const loginForm = document.getElementById('login-form');
      const registerForm = document.getElementById('register-form');

      if (tab === 'login') {
        loginTab.classList.add('active');
        registerTab.classList.remove('active');
        loginForm.style.display = 'block';
        registerForm.style.display = 'none';
      } else {
        registerTab.classList.add('active');
        loginTab.classList.remove('active');
        loginForm.style.display = 'none';
        registerForm.style.display = 'block';
      }
    }
  </script>
</body>
</html>
